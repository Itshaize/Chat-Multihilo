name: Pruebas Python y TUI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas TCP y TUI sin pantalla gráfica
        run: python -m unittest discover -p 'prueba*.py' -v
